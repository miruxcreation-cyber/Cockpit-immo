<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fiche découverte · ERA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f2f2f7; color: #1c1c1e; line-height: 1.5; padding: 0 0 48px;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }
    .slide {
      background: white; border-radius: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
      padding: 24px 20px 32px; margin-bottom: 20px;
    }
    .slide-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .slide-icon { font-size: 32px; }
    .slide-title { font-size: 22px; font-weight: 700; color: #1e2a3e; letter-spacing: -0.3px; }
    .slide-sub { font-size: 14px; color: #5a6e8a; margin-top: 4px; }
    .progress-bar { height: 4px; background: #e2e8f0; border-radius: 4px; margin: 16px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #1a1f5e, #c8141e); border-radius: 4px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .btn-choice {
      background: #f1f4f9; border: 1px solid #e2e8f0; padding: 10px 18px;
      border-radius: 40px; font-size: 15px; font-weight: 500; cursor: pointer;
      transition: all 0.15s; color: #1e2a3e; text-align: center;
    }
    .btn-choice.selected { background: #1a1f5e; border-color: #1a1f5e; color: white; }
    .btn-choice:active { transform: scale(0.97); }
    input, textarea {
      width: 100%; padding: 14px 16px; border: 1px solid #dce3ec; border-radius: 16px;
      font-size: 16px; background: white; transition: 0.2s; font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #1a1f5e; box-shadow: 0 0 0 3px rgba(26,31,94,0.12);
    }
    .dynamic-field { margin-top: 12px; display: none; }
    .dynamic-field.show { display: block; }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; }
    .btn-nav {
      background: #eef2f6; border: none; padding: 12px 24px; border-radius: 40px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.15s; color: #1e2a3e;
    }
    .btn-nav.primary { background: linear-gradient(135deg, #1a1f5e, #2a3080); color: white; flex: 1; box-shadow: 0 4px 14px rgba(26,31,94,0.3); }
    .btn-nav:active { transform: scale(0.96); }
    .btn-nav:disabled { opacity: 0.4; cursor: default; }
    .progress-dots { display: flex; justify-content: center; gap: 8px; margin: 16px 0 8px; }
    .dot { width: 8px; height: 8px; border-radius: 8px; background: #cbd5e1; transition: 0.2s; }
    .dot.active { background: #1a1f5e; width: 20px; }
    .recap-card { background: #f8fafc; border-radius: 20px; padding: 16px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .recap-line { padding: 8px 0; border-bottom: 1px solid #e9eef3; display: flex; flex-wrap: wrap; gap: 8px; }
    .recap-label { font-weight: 600; width: 130px; color: #4a5b7a; font-size: 13px; }
    .recap-value { flex: 1; color: #1e2a3e; font-size: 14px; }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #2c3e50; color: white; padding: 12px 20px; border-radius: 40px;
      font-size: 14px; font-weight: 500; opacity: 0; transition: 0.2s;
      pointer-events: none; z-index: 1000; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    @media (max-width: 500px) {
      body { padding: 16px 12px 32px; }
      .slide { padding: 20px 16px 28px; }
      .btn-choice { padding: 8px 14px; font-size: 14px; }
      .btn-nav { padding: 10px 20px; }
    }

    /* HEADER */
    .hero {
      background: linear-gradient(160deg, #1a1f5e 0%, #2a3080 60%, #c8141e 100%);
      padding: 48px 24px 36px;
      text-align: center;
      border-radius: 0 0 36px 36px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(26,31,94,0.18);
    }
    .hero-logo { width: 90px; height: auto; margin-bottom: 16px; }
    .hero-agency {
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 8px;
    }
    .hero-slogan {
      font-size: 21px; font-weight: 700; color: #fff;
      letter-spacing: -0.4px; line-height: 1.3; margin-bottom: 6px;
    }
    .hero-sub { font-size: 14px; color: rgba(255,255,255,0.75); margin-bottom: 20px; }
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 13px; font-weight: 600;
      padding: 6px 16px; border-radius: 40px; backdrop-filter: blur(8px);
    }
    .agency-card {
      background: white; border-radius: 22px;
      margin: 0 16px 20px; padding: 16px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      display: flex; gap: 16px; align-items: center;
    }
    .agency-avatar {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #1a1f5e, #c8141e);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: white;
      flex-shrink: 0; letter-spacing: -1px;
    }
    .agency-info { flex: 1; }
    .agency-name { font-size: 15px; font-weight: 700; color: #1c1c1e; }
    .agency-detail { font-size: 13px; color: #6e6e73; margin-top: 2px; }
    .agency-contact { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip-contact {
      background: #f2f2f7; border-radius: 20px; padding: 4px 12px;
      font-size: 12px; font-weight: 600; color: #1a1f5e; text-decoration: none;
    }
    .step-counter {
      font-size: 12px; font-weight: 600; color: #8e8e93;
      text-align: right; margin-bottom: 8px;
    }
  </style>
</head>
<body>

<!-- Formulaire caché OBLIGATOIRE pour que Netlify détecte les champs -->
<form name="fiche-decouverte" data-netlify="true" style="display:none">
  <input name="nom"><input name="projet"><input name="projet_other">
  <input name="type"><input name="type_other">
  <input name="surface"><input name="surface_other">
  <input name="pieces"><input name="pieces_other">
  <input name="chambres"><input name="chambres_other">
  <input name="exterieur"><input name="exterieur_other">
  <input name="secteurs"><input name="secteurs_other">
  <input name="budget"><input name="budget_other">
  <input name="apport"><input name="apport_other">
  <input name="financement"><input name="financement_other">
  <input name="vente">
  <input name="echeance"><input name="echeance_other">
  <input name="declencheur">
  <input name="priorite"><input name="priorite_other">
  <input name="libre"><input name="timestamp">
</form>


<!-- Header hero -->
<div class="hero">
  <svg class="hero-logo" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
    <polygon points="100,10 10,90 55,90 55,70 100,35 145,70 145,90 190,90" fill="white"/>
    <text x="100" y="155" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="72" fill="white" letter-spacing="-2">ERA</text>
    <rect x="28" y="166" width="144" height="8" rx="4" fill="#e8192c"/>
    <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white" letter-spacing="3">IMMOBILIER</text>
  </svg>
  <div class="hero-agency">ERA Immobilier · La Plaine Saint-Denis</div>
  <div class="hero-slogan">Quel est votre projet ?</div>
  <div class="hero-sub">Des valeurs humaines, un engagement réel.<br>Réalisons-le ensemble.</div>
  <div class="hero-badge">🔑 Recherche personnalisée &amp; gratuite</div>
</div>

<!-- Card agence -->
<div style="max-width:600px;margin:0 auto;">
<div class="agency-card">
  <div class="agency-avatar">SB</div>
  <div class="agency-info">
    <div class="agency-name">Samir B. — Conseiller ERA</div>
    <div class="agency-detail">ERA Agence du Stade · 17 rue Proudhon, 93210 La Plaine Saint-Denis</div>
    <div class="agency-contact">
      <a href="tel:0763030470" class="chip-contact">📞 07 63 03 04 70</a>
      <a href="tel:0149210050" class="chip-contact">🏢 01 49 21 00 50</a>
    </div>
  </div>
</div>
</div>

<div class="container" id="app"></div>
<div id="toast" class="toast"></div>

<script>
// Toutes les options sans apostrophe dans le JS — le texte affiché est dans le tableau
var STEPS = [
  {
    id: 'nom',
    question: '👋 Comment vous appelez-vous ?',
    type: 'text',
    placeholder: 'Prénom et nom',
    required: true
  },
  {
    id: 'projet',
    question: '🎯 Quel est votre projet ?',
    type: 'single',
    options: [
      'Achat résidence principale',
      'Achat investissement locatif',
      'Achat résidence secondaire',
      'Achat pour un proche',
      'Je ne sais pas encore'
    ],
    hasOther: true,
    required: true
  },
  {
    id: 'type',
    question: '🏢 Appartement ou maison ?',
    type: 'multi',
    options: ['Appartement', 'Maison', 'Duplex', 'Loft'],
    hasOther: true,
    required: false
  },
  {
    id: 'surface',
    question: '📐 Surface minimum souhaitée ?',
    type: 'single',
    options: ['Moins de 30m²', '30 à 40m²', '40 à 50m²', '50 à 60m²', '60 à 70m²', '70 à 80m²', 'Plus de 80m²'],
    hasOther: true,
    required: false
  },
  {
    id: 'pieces',
    question: '🛋️ Nombre de pièces minimum ?',
    type: 'single',
    options: ['1', '2', '3', '4', '5 et plus'],
    hasOther: true,
    required: false
  },
  {
    id: 'chambres',
    question: '🛏️ Nombre de chambres minimum ?',
    type: 'single',
    options: ['0', '1', '2', '3', '4 et plus'],
    hasOther: true,
    required: false
  },
  {
    id: 'exterieur',
    question: '🌿 Besoin extérieur ?',
    type: 'multi',
    options: ['Balcon', 'Terrasse', 'Jardin', 'Pas besoin'],
    hasOther: true,
    required: false
  },
  {
    id: 'secteurs',
    question: '📍 Où souhaitez-vous habiter ?',
    type: 'multi',
    options: [
      'La Plaine Saint-Denis',
      'Stains',
      'L\u2019\u00CEle-Saint-Denis',
      'Saint-Denis centre',
      'Pleyel',
      'Front Populaire',
      'Garges-l\u00E8s-Gonesse',
      'Sarcelles'
    ],
    hasOther: true,
    required: true
  },
  {
    id: 'budget',
    question: '💰 Votre budget maximum ?',
    type: 'single',
    options: [
      'Moins de 150 000\u20AC',
      '150 000 à 200 000\u20AC',
      '200 000 à 250 000\u20AC',
      '250 000 à 300 000\u20AC',
      '300 000 à 400 000\u20AC',
      'Plus de 400 000\u20AC'
    ],
    hasOther: true,
    required: true
  },
  {
    id: 'apport',
    question: '💶 Apport personnel ?',
    type: 'single',
    options: ['0\u20AC', '10 000\u20AC', '20 000\u20AC', '30 000\u20AC', '50 000\u20AC', 'Plus de 50 000\u20AC', 'Je ne sais pas'],
    hasOther: true,
    required: false
  },
  {
    id: 'financement',
    question: '🏦 Où en est votre financement ?',
    type: 'single',
    options: [
      'Accord de principe',
      'Simulation en cours',
      'Contact avec courtier',
      'Pas encore',
      'Achat comptant'
    ],
    hasOther: true,
    required: true
  },
  {
    id: 'vente',
    question: '🔄 Avez-vous un bien à vendre ?',
    type: 'single',
    options: ['Oui', 'Non'],
    hasOther: false,
    required: false
  },
  {
    id: 'echeance',
    question: '📅 Votre échéance idéale ?',
    type: 'single',
    options: ['Moins de 3 mois', '3 à 6 mois', '6 à 12 mois', 'Plus d\u2019un an', 'Flexible'],
    hasOther: true,
    required: true
  },
  {
    id: 'declencheur',
    question: '💡 Ce qui vous a décidé à chercher maintenant ?',
    type: 'text',
    placeholder: 'Naissance, mutation, investissement…',
    required: false
  },
  {
    id: 'priorite',
    question: '⭐ Si vous ne gardez qu\u2019un seul critère ?',
    type: 'single',
    options: [],
    dynamic: true,
    hasOther: true,
    required: false
  },
  {
    id: 'libre',
    question: '💬 Ce que vous voulez ajouter',
    type: 'textarea',
    placeholder: 'Votre message…',
    required: false
  }
];

var currentStep = 0;
var answers = {};

// Pré-remplir via URL
var urlP = new URLSearchParams(window.location.search);
var prenomUrl = urlP.get('prenom');
if (prenomUrl) answers.nom = prenomUrl;

// Restaurer depuis localStorage
try {
  var saved = localStorage.getItem('fiche_era_v2');
  if (saved) {
    var parsed = JSON.parse(saved);
    if (typeof parsed.step === 'number' && parsed.step < STEPS.length) {
      currentStep = parsed.step;
      Object.assign(answers, parsed.answers);
    }
  }
} catch(e) {}

function saveState() {
  try { localStorage.setItem('fiche_era_v2', JSON.stringify({ step: currentStep, answers: answers })); } catch(e) {}
}

function getPriorityOptions() {
  var opts = [];
  if (answers.surface)     opts.push('Surface : ' + answers.surface);
  if (answers.pieces)      opts.push('Pièces : ' + answers.pieces);
  if (answers.chambres)    opts.push('Chambres : ' + answers.chambres);
  if (answers.budget)      opts.push('Budget : ' + answers.budget);
  if (answers.secteurs)    opts.push('Secteurs : ' + cleanVal(answers.secteurs));
  if (answers.exterieur)   opts.push('Extérieur : ' + cleanVal(answers.exterieur));
  if (answers.type)        opts.push('Type : ' + cleanVal(answers.type));
  if (answers.financement) opts.push('Financement : ' + answers.financement);
  if (answers.echeance)    opts.push('Échéance : ' + answers.echeance);
  if (opts.length === 0)   opts.push('Aucun critère défini');
  return opts;
}

function cleanVal(v) {
  return v ? v.replace(/\|\|/g, ', ') : '';
}

function isSelected(step, val) {
  if (!answers[step.id]) return false;
  if (step.type === 'multi') return answers[step.id].split('||').includes(val);
  return answers[step.id] === val;
}

function render() {
  var step = STEPS[currentStep];
  if (step.dynamic) step.options = getPriorityOptions();

  var pct = Math.round(((currentStep + 1) / STEPS.length) * 100);

  var inputHtml = '';
  if (step.type === 'text') {
    inputHtml = '<input type="text" id="field" autocomplete="off" placeholder="' + step.placeholder + '">';
  } else if (step.type === 'textarea') {
    inputHtml = '<textarea id="field" rows="4" placeholder="' + step.placeholder + '"></textarea>';
  } else {
    inputHtml = '<div class="btn-group" id="btn-group">';
    for (var i = 0; i < step.options.length; i++) {
      var sel = isSelected(step, step.options[i]) ? ' selected' : '';
      inputHtml += '<button class="btn-choice' + sel + '" data-idx="' + i + '">' + step.options[i] + '</button>';
    }
    if (step.hasOther) {
      var otherSel = isSelected(step, '__AUTRE__') ? ' selected' : '';
      inputHtml += '<button class="btn-choice' + otherSel + '" data-idx="__AUTRE__">Autre</button>';
    }
    inputHtml += '</div>';
    inputHtml += '<div id="other-box" class="dynamic-field"><input type="text" id="other-field" placeholder="Précisez…"></div>';
  }

  var dots = '';
  for (var d = 0; d < STEPS.length; d++) {
    dots += '<div class="dot' + (d === currentStep ? ' active' : '') + '"></div>';
  }

  var btnLabel = currentStep === STEPS.length - 1 ? 'Terminer →' : 'Suivant →';

  document.getElementById('app').innerHTML =
    '<div class="step-counter">Étape ' + (currentStep + 1) + ' / ' + STEPS.length + '</div>' +
    '<div class="slide">' +
      '<div class="slide-header">' +
        '<div class="slide-icon">' + step.question.split(' ')[0] + '</div>' +
        '<div><div class="slide-title">' + step.question + '</div>' +
        '<div class="slide-sub">Recherche personnalisée · ERA La Plaine Saint-Denis</div></div>' +
      '</div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      inputHtml +
      '<div class="nav-buttons">' +
        '<button class="btn-nav" id="btn-prev"' + (currentStep === 0 ? ' disabled' : '') + '>← Retour</button>' +
        '<button class="btn-nav primary" id="btn-next">' + btnLabel + '</button>' +
      '</div>' +
      '<div class="progress-dots">' + dots + '</div>' +
    '</div>';

  // Restaurer valeurs
  var field = document.getElementById('field');
  if (field && answers[step.id]) field.value = answers[step.id];

  var otherField = document.getElementById('other-field');
  if (otherField && answers[step.id + '_other']) {
    otherField.value = answers[step.id + '_other'];
  }

  updateOtherBox(step);

  // Attacher les clics sur les boutons via data-idx (zéro problème d'apostrophe)
  var bg = document.getElementById('btn-group');
  if (bg) {
    var btns = bg.querySelectorAll('.btn-choice');
    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = btn.getAttribute('data-idx');
        var val = idx === '__AUTRE__' ? '__AUTRE__' : step.options[parseInt(idx)];
        handleChoice(step, val);
      });
    });
  }

  document.getElementById('btn-next').addEventListener('click', nextStep);
  document.getElementById('btn-prev').addEventListener('click', prevStep);
}

function updateOtherBox(step) {
  var box = document.getElementById('other-box');
  if (!box) return;
  if (isSelected(step, '__AUTRE__')) box.classList.add('show');
  else box.classList.remove('show');
}

function handleChoice(step, val) {
  if (step.type === 'multi') {
    var current = answers[step.id] ? answers[step.id].split('||') : [];
    var idx2 = current.indexOf(val);
    if (idx2 > -1) current.splice(idx2, 1);
    else current.push(val);
    answers[step.id] = current.join('||');
  } else {
    answers[step.id] = val;
  }
  saveState();
  updateOtherBox(step);
  // Rafraichir visuellement les boutons
  var bg = document.getElementById('btn-group');
  if (bg) {
    bg.querySelectorAll('.btn-choice').forEach(function(btn) {
      var idx = btn.getAttribute('data-idx');
      var bVal = idx === '__AUTRE__' ? '__AUTRE__' : step.options[parseInt(idx)];
      if (isSelected(step, bVal)) btn.classList.add('selected');
      else btn.classList.remove('selected');
    });
  }
}

function nextStep() {
  var step = STEPS[currentStep];
  var field = document.getElementById('field');
  var otherField = document.getElementById('other-field');

  if (field) answers[step.id] = field.value.trim();
  if (otherField && otherField.value.trim()) {
    answers[step.id + '_other'] = otherField.value.trim();
  }

  // Remplacer le marqueur __AUTRE__ par le texte saisi
  if (answers[step.id] && answers[step.id].includes('__AUTRE__')) {
    var otherText = answers[step.id + '_other'] || 'Autre';
    answers[step.id] = answers[step.id].replace('__AUTRE__', otherText);
  }

  var val = answers[step.id] || '';
  if (step.required && val.trim() === '') {
    toast('⚠️ Veuillez répondre avant de continuer');
    return;
  }

  saveState();
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    render();
    window.scrollTo(0, 0);
  } else {
    showRecap();
  }
}

function prevStep() {
  if (currentStep > 0) { currentStep--; render(); window.scrollTo(0, 0); }
}

function showRecap() {
  var lines = '';
  STEPS.forEach(function(step) {
    var val = answers[step.id] || '';
    if (!val) return;
    val = val.replace(/\|\|/g, ', ');
    var label = step.question.replace(/^[^\s]+\s/, '');
    lines += '<div class="recap-line"><div class="recap-label">' + label + '</div><div class="recap-value">' + val + '</div></div>';
  });

  document.getElementById('app').innerHTML =
    '<div class="step-counter">Étape ' + (currentStep + 1) + ' / ' + STEPS.length + '</div>' +
    '<div class="slide">' +
      '<div class="slide-header"><div class="slide-icon">📋</div>' +
      '<div><div class="slide-title">Votre fiche projet</div>' +
      '<div class="slide-sub">Vérifiez avant envoi</div></div></div>' +
      '<div class="recap-card">' + lines + '</div>' +
      '<div class="nav-buttons">' +
        '<button class="btn-nav" id="btn-modify">← Modifier</button>' +
        '<button class="btn-nav primary" id="btn-send">✅ Envoyer à Samir</button>' +
      '</div>' +
    '</div>';

  document.getElementById('btn-modify').addEventListener('click', function() {
    currentStep = STEPS.length - 1; render();
  });
  document.getElementById('btn-send').addEventListener('click', submitForm);
}

function submitForm() {
  // Construire le message WhatsApp avec toutes les réponses
  var msg = '📋 *Fiche Découverte ERA*\n';
  msg += '━━━━━━━━━━━━━━━━\n';

  STEPS.forEach(function(step) {
    var val = answers[step.id] || '';
    if (!val) return;
    val = val.replace(/\|\|/g, ', ');
    var label = step.question.replace(/^[^\s]+\s/, '');
    msg += '*' + label + '*\n' + val + '\n\n';
  });

  msg += '━━━━━━━━━━━━━━━━\n';
  msg += '_Envoyé via Fiche ERA · ' + new Date().toLocaleDateString('fr-FR') + '_';

  // Numéro WhatsApp de Samir — format international sans le 0
  var tel = '33763030470';
